name: Discord Deploy Notification

on:
  workflow_run:
    workflows: ["Export & Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Always check out the latest main so message_ids.json is up to date
          ref: main

      - name: Wait for Pages CDN
        run: sleep 5

      - name: Read version
        id: ver
        run: |
          VERSION=$(jq -r '.version' discord/version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for existing Discord message ID
        id: msg
        run: |
          V="${{ steps.ver.outputs.version }}"
          if jq -e --arg v "$V" 'has($v)' discord/message_ids.json > /dev/null 2>&1; then
            ID=$(jq -r --arg v "$V" '.[$v]' discord/message_ids.json)
            echo "exists=true"  >> $GITHUB_OUTPUT
            echo "id=$ID"       >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Discord plain text payload
        run: |
          CHANGES=$(jq -r '[.changes[] | "- " + .] | join("\n")' discord/version.json)
          VERSION=$(jq -r '.version' discord/version.json)
          TITLE=$(jq -r '.title' discord/version.json)
          DESC=$(jq -r '.description' discord/version.json)
          H1="# 🚀 Cosmic Forge v${VERSION} — ${TITLE}"
          H2="### 📝 Änderungen"
          LINK="🎮 **[Jetzt spielen](https://danielzaiser91.github.io/cosmic-forge/)**"
          printf '<@&1535341247282020372>\n\n%s\n\n%s\n\n%s\n%s\n\n%s\n' \
            "$H1" "$DESC" "$H2" "$CHANGES" "$LINK" > /tmp/text.txt
          jq -n --rawfile content /tmp/text.txt \
            '{"content":$content,"allowed_mentions":{"roles":["1535341247282020372"]},"flags":4}' \
            > /tmp/payload.json
          cat /tmp/payload.json

      - name: POST new Discord message
        if: steps.msg.outputs.exists == 'false'
        id: post
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.DISCORD_WEBHOOK_URL }}?wait=true" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json)
          echo "Response: $RESPONSE"
          MSG_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$MSG_ID" ]; then
            echo "ERROR: Could not extract message ID from response"
            exit 1
          fi
          echo "msg_id=$MSG_ID" >> $GITHUB_OUTPUT

      - name: PATCH existing Discord message
        if: steps.msg.outputs.exists == 'true'
        run: |
          curl -s -X PATCH \
            "${{ secrets.DISCORD_WEBHOOK_URL }}/messages/${{ steps.msg.outputs.id }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json

      - name: Save new message ID to repo
        if: steps.msg.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          ID="${{ steps.post.outputs.msg_id }}"
          jq --arg v "$V" --arg id "$ID" '.[$v] = $id' discord/message_ids.json \
            > /tmp/new_ids.json
          mv /tmp/new_ids.json discord/message_ids.json
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add discord/message_ids.json
          git commit -m "chore: save Discord message ID for v$V [skip ci]"
          git push
